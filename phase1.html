<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Secured Terminal</title>
</head>
<body style="background-color: white; color: black; font-family: monospace; text-align: left; margin: 50px; max-width: 600px; margin-left: auto; margin-right: auto;">

    <p>Restricted Document Access</p>
    <p>Enter password:</p>

    <input type="password" id="passkey" style="background: white; border: 1px solid black; padding: 5px;">
    <br><br>
    <button onclick="decryptFile()" style="background: white; border: 1px solid black; padding: 5px 10px; cursor: pointer;">Enter Password</button>
    
    <p id="error" style="color: red;"></p>

    <script>
        function decryptFile() {
            let inputWord = document.getElementById("passkey").value;
            if (inputWord === "TARGET_WORD") {
                window.location.href = "https://everysmileyoueverfakedwasrecorded.github.io";
            } else {
                document.getElementById("error").innerText = "Access Denied: Invalid Key";
            }
        }
    </script>

</body>
</html>
